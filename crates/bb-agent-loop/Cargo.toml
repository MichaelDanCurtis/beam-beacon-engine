[package]
name        = "bb-agent-loop"
description = "The core AI agent loop: tool-use, streaming, retry policy, conversation state. Part of beam-beacon-engine."

version.workspace      = true
edition.workspace      = true
rust-version.workspace = true
license.workspace      = true
authors.workspace      = true
repository.workspace   = true
homepage.workspace     = true
publish.workspace      = true

[dependencies]
bb-providers.workspace   = true
bb-tool-bridge.workspace = true
futures.workspace        = true
serde_json.workspace     = true
thiserror.workspace      = true
tokio = { workspace = true, features = ["sync", "time"] }

[dev-dependencies]
tokio = { workspace = true, features = ["rt", "macros", "time", "sync", "test-util"] }

[lints]
workspace = true

[lib]
path = "src/lib.rs"
