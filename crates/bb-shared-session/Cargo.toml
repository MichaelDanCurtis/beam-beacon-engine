[package]
name        = "bb-shared-session"
description = "Session state shared across surfaces: blocks, agent, terminal model, history. Part of beam-beacon-engine."

version.workspace      = true
edition.workspace      = true
rust-version.workspace = true
license.workspace      = true
authors.workspace      = true
repository.workspace   = true
homepage.workspace     = true
publish.workspace      = true

[dependencies]
bb-terminal-model.workspace = true
bb-vt-parser.workspace      = true
bb-block-list.workspace     = true
bb-providers.workspace      = true
bb-tool-bridge.workspace    = true
bb-agent-loop.workspace     = true
futures.workspace           = true
thiserror.workspace         = true
serde.workspace             = true
serde_json.workspace        = true
tokio = { workspace = true, features = ["sync"] }

[dev-dependencies]
tokio = { workspace = true, features = ["rt", "macros", "sync"] }

[lints]
workspace = true

[lib]
path = "src/lib.rs"
