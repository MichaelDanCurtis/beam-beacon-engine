name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  check:
    name: cargo check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - name: Cache cargo registry / target
        uses: Swatinem/rust-cache@v2
      - name: cargo check --workspace
        run: cargo check --workspace --all-targets

  # Every other job passes `--all-targets`, which also builds test targets and
  # therefore unifies [dev-dependencies] features into the build. That masks a
  # library that only compiles because a dev-dependency happened to enable a
  # feature it uses (this repo shipped exactly that bug: `tokio::select!` in
  # bb-agent-loop with `macros` only under [dev-dependencies] — the whole CI
  # suite was green while the library was unbuildable for Beam and Beacon).
  # This job builds ONLY the libraries, the way a real consumer does.
  build:
    name: cargo build (libs only)
    runs-on: ubuntu-latest
    needs: check
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
      - name: Cache cargo registry / target
        uses: Swatinem/rust-cache@v2
      - name: cargo build --workspace --lib
        run: cargo build --workspace --lib --locked
      - name: cargo build --workspace --lib --no-default-features
        run: cargo build --workspace --lib --no-default-features --locked

  test:
    name: cargo test
    runs-on: ubuntu-latest
    needs: check
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
      - name: Cache cargo registry / target
        uses: Swatinem/rust-cache@v2
      # NOTE: `--all-targets` silently EXCLUDES doctests, so it must be paired
      # with a separate `--doc` run. Collapsing these into one `--all-targets`
      # invocation would stop exercising every ``` example in the public docs.
      - name: cargo test --workspace
        run: cargo test --workspace --all-targets --locked
      - name: cargo test --workspace --doc
        run: cargo test --workspace --doc --locked

  # docs/MIGRATION-CHECKLIST.md asks for 80%+ line coverage because both
  # consumers depend on these crates staying stable. Every crate currently
  # sits above 93%; the floor is set below that so honest refactors don't
  # trip it, while a genuine coverage collapse still fails the build.
  coverage:
    name: cargo llvm-cov
    runs-on: ubuntu-latest
    needs: check
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: llvm-tools-preview
      - name: Cache cargo registry / target
        uses: Swatinem/rust-cache@v2
      - name: Install cargo-llvm-cov
        uses: taiki-e/install-action@cargo-llvm-cov
      - name: cargo llvm-cov --workspace
        run: cargo llvm-cov --workspace --all-features --locked --fail-under-lines 85

  clippy:
    name: cargo clippy
    runs-on: ubuntu-latest
    needs: check
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - name: Cache cargo registry / target
        uses: Swatinem/rust-cache@v2
      - name: cargo clippy --workspace
        run: cargo clippy --workspace --all-targets -- -D warnings

  fmt:
    name: cargo fmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: cargo fmt --check
        run: cargo fmt --all -- --check

  # Both consumers pin to the MSRV declared in [workspace.package].rust-version.
  # Building only on `stable` would let that promise drift until Beam or Beacon
  # discovered the break for us.
  msrv:
    name: cargo check (MSRV 1.78)
    runs-on: ubuntu-latest
    needs: check
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust 1.78
        uses: dtolnay/rust-toolchain@1.78
      - name: Cache cargo registry / target
        uses: Swatinem/rust-cache@v2
      - name: cargo check --workspace on MSRV
        run: cargo check --workspace --all-targets --locked

  # The whole reason this repo exists is license-cascade safety (see
  # docs/ARCHITECTURE.md). cargo-deny turns "MIT OR Apache-2.0 only" from a
  # code-review promise into a build failure.
  deny:
    name: cargo deny
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: cargo-deny (licenses, bans, advisories, sources)
        uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check licenses bans advisories sources
