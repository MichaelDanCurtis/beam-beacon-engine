name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  check:
    name: cargo check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - name: Cache cargo registry / target
        uses: Swatinem/rust-cache@v2
      - name: cargo check --workspace
        run: cargo check --workspace --all-targets

  test:
    name: cargo test
    runs-on: ubuntu-latest
    needs: check
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
      - name: Cache cargo registry / target
        uses: Swatinem/rust-cache@v2
      # NOTE: `--all-targets` silently EXCLUDES doctests, so it must be paired
      # with a separate `--doc` run. Collapsing these into one `--all-targets`
      # invocation would stop exercising every ``` example in the public docs.
      - name: cargo test --workspace
        run: cargo test --workspace --all-targets --locked
      - name: cargo test --workspace --doc
        run: cargo test --workspace --doc --locked

  clippy:
    name: cargo clippy
    runs-on: ubuntu-latest
    needs: check
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - name: Cache cargo registry / target
        uses: Swatinem/rust-cache@v2
      - name: cargo clippy --workspace
        run: cargo clippy --workspace --all-targets -- -D warnings

  fmt:
    name: cargo fmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: cargo fmt --check
        run: cargo fmt --all -- --check

  # Both consumers pin to the MSRV declared in [workspace.package].rust-version.
  # Building only on `stable` would let that promise drift until Beam or Beacon
  # discovered the break for us.
  msrv:
    name: cargo check (MSRV 1.78)
    runs-on: ubuntu-latest
    needs: check
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust 1.78
        uses: dtolnay/rust-toolchain@1.78
      - name: Cache cargo registry / target
        uses: Swatinem/rust-cache@v2
      - name: cargo check --workspace on MSRV
        run: cargo check --workspace --all-targets --locked

  # The whole reason this repo exists is license-cascade safety (see
  # docs/ARCHITECTURE.md). cargo-deny turns "MIT OR Apache-2.0 only" from a
  # code-review promise into a build failure.
  deny:
    name: cargo deny
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: cargo-deny (licenses, bans, advisories, sources)
        uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check licenses bans advisories sources
