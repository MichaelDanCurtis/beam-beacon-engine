[package]
name        = "bb-terminal-model"
description = "Terminal state: grid, cells, attributes, cursor, viewport. Part of beam-beacon-engine."

version.workspace      = true
edition.workspace      = true
rust-version.workspace = true
license.workspace      = true
authors.workspace      = true
repository.workspace   = true
homepage.workspace     = true
publish.workspace      = true

[lints]
workspace = true

[lib]
path = "src/lib.rs"

[features]
# Derives `Serialize`/`Deserialize` on all pure-data types. Off by default.
serde = ["dep:serde"]

[dependencies]
unicode-width.workspace = true
serde = { workspace = true, optional = true }
